<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criativos Palavra Secreta</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FBF7F0;--ink:#1E2430;--ink2:#4A5262;--brand:#1F3A4D;--gold:#C79A4B;--gold2:#E7C887;--cta:#E0702B;--line:#E4DACA}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:540px;height:960px;overflow:hidden;font-family:Inter,sans-serif}
  #stage{position:relative;width:540px;height:960px;overflow:hidden;background:var(--bg)}
  #bg{position:absolute;inset:-10%;transition:none}
  .dark #bg{background:radial-gradient(600px 500px at 70% 20%,#2C5470 0,transparent 60%),radial-gradient(500px 400px at 20% 90%,#3a2f1c 0,transparent 60%),#132634}
  .light #bg{background:radial-gradient(600px 500px at 80% 10%,#F1E3C8 0,transparent 60%),radial-gradient(500px 500px at 10% 90%,#EFE4D2 0,transparent 60%),var(--bg)}
  #scene{position:absolute;left:44px;right:44px;top:130px;bottom:190px;display:flex;flex-direction:column;justify-content:center;gap:22px}
  .dark #scene{color:#EEF2F5}
  .light #scene{color:var(--ink)}
  .a{will-change:transform,opacity}
  .k{font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  .h{font-family:Fraunces,serif;font-weight:700;font-size:50px;line-height:1.05;letter-spacing:-.01em}
  .h.m{font-size:42px}
  .dark .h{color:#fff}
  .light .h{color:var(--brand)}
  .p{font-size:24px;line-height:1.35;font-weight:500}
  .dark .p{color:#C9D5DE}
  .light .p{color:var(--ink2)}
  .hl{background:linear-gradient(transparent 60%,rgba(199,154,75,.55) 60%);padding:0 4px}
  .light .hl{background:linear-gradient(transparent 60%,var(--gold2) 60%)}
  .pill{display:inline-block;align-self:flex-start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:12px 20px;font-size:22px;font-weight:600}
  .light .pill{background:#fff;border-color:var(--line)}
  .row{display:flex;gap:16px;align-items:center;font-size:25px;font-weight:600;line-height:1.25;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:18px 20px}
  .light .row{background:#fff;border-color:var(--line)}
  .num{flex:none;width:48px;height:48px;border-radius:50%;background:var(--gold);color:#1E2430;display:grid;place-items:center;font-family:Fraunces,serif;font-size:26px}
  .quote{font-family:Fraunces,serif;font-size:36px;line-height:1.2;border-left:5px solid var(--gold);padding-left:22px;min-height:4.8em}
  .ref{font-size:18px;font-weight:600;color:var(--gold);letter-spacing:.1em}
  .cta{align-self:center;background:var(--cta);color:#fff;font-weight:800;font-size:26px;padding:22px 34px;border-radius:999px;box-shadow:0 10px 30px rgba(224,112,43,.45);text-align:center}
  .price{font-family:Fraunces,serif;font-size:76px;line-height:1;font-weight:700;text-align:center;color:#fff}
  .light .price{color:var(--brand)}
  .price sup{font-size:28px;vertical-align:top;margin-right:4px}
  .small{font-size:19px;text-align:center;opacity:.8}
  .c{text-align:center;align-self:center}
  /* mockup */
  .mock{position:relative;width:330px;height:390px;align-self:center}
  .book{position:absolute;left:10px;top:10px;width:230px;height:330px;border-radius:5px 12px 12px 5px;background:linear-gradient(135deg,#1F3A4D,#132634);box-shadow:16px 20px 44px rgba(0,0,0,.4),inset 7px 0 0 rgba(255,255,255,.06);color:#fff;padding:34px 24px;display:flex;flex-direction:column;justify-content:space-between;transform:rotate(-4deg)}
  .book .t{font-family:Fraunces,serif;font-size:40px;line-height:1}
  .book .kk{font-size:11px;letter-spacing:.3em;color:var(--gold2);text-transform:uppercase}
  .book .ln{height:2px;width:40%;background:var(--gold);margin:14px 0}
  .book .s{font-size:13px;opacity:.85}
  .ph{position:absolute;right:0;bottom:0;width:140px;height:270px;border-radius:24px;background:#0d1114;padding:6px;box-shadow:0 16px 36px rgba(0,0,0,.4);transform:rotate(5deg)}
  .ph .scr{height:100%;border-radius:19px;background:var(--bg);padding:30px 14px;display:flex;flex-direction:column;gap:8px;color:var(--brand)}
  .ph .d{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--gold)}
  .ph b{font-family:Fraunces,serif;font-size:16px;line-height:1.1}
  .ph i{display:block;height:6px;border-radius:6px;background:var(--line)}
  .ph i.g{background:var(--gold);width:60%}
  .seal{position:absolute;left:-14px;bottom:20px;width:96px;height:96px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;text-align:center;font-weight:800;font-size:15px;line-height:1.1;transform:rotate(-10deg);box-shadow:0 8px 20px rgba(0,0,0,.25)}
  /* barra de progresso + marca */
  #prog{position:absolute;left:0;top:0;height:5px;background:var(--gold);width:0}
  #brand{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-family:Fraunces,serif;font-size:18px;letter-spacing:.06em;opacity:.55}
  .dark #brand{color:#fff}
  .light #brand{color:var(--brand)}
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><div id="prog"></div><div id="scene"></div><div id="brand">Palavra Secreta</div></div>

<script>
const MOCK = `<div class="mock a" data-d="0" data-fx="pop"><div class="book"><div class="kk">Método de 30 dias</div><div><div class="t">Palavra<br>Secreta</div><div class="ln"></div><div class="s">5 minutos por dia para uma mente em paz</div></div><div class="s">Diário guiado + 3 bônus</div></div><div class="ph"><div class="scr"><span class="d">DIA 07</span><b>Quando a mente grita</b><i></i><i></i><i class="g"></i><i></i></div></div><div class="seal">30 dias<br>de paz</div></div>`;

const OFFER = (theme) => ({ dur: 3.6, theme, html: `
  <div class="k c a" data-d="0">Acesso completo + 3 bônus</div>
  <div class="price a" data-d=".25" data-fx="pop"><sup>R$</sup>19,90</div>
  <div class="small a" data-d=".5">pagamento único · acesso imediato · garantia de 7 dias</div>
  <div class="cta a" data-d=".9" data-fx="pulse">Toque em “Saiba mais” →</div>` });

const VIDEOS = {
  /* 1 — Dor: mente que não desliga */
  "01-mente-que-nao-desliga": [
    { dur: 2.6, theme: "dark", html: `
      <div class="k a" data-d="0">Se isso acontece com você…</div>
      <div class="h a" data-d=".15">Você deita, apaga a luz… e a <span class="hl">cabeça liga.</span></div>` },
    { dur: 3.4, theme: "dark", html: `
      <div class="row a" data-d="0"><span class="num">1</span>Repassa a conversa de hoje</div>
      <div class="row a" data-d=".55"><span class="num">2</span>Se preocupa com o boleto de amanhã</div>
      <div class="row a" data-d="1.1"><span class="num">3</span>Pega o celular “só um pouquinho”</div>
      <div class="p a" data-d="1.8">…e às 2h da manhã ainda está acordado.</div>` },
    { dur: 2.6, theme: "dark", html: `
      <div class="h m a" data-d="0">Não é falta de força.</div>
      <div class="h m a" data-d=".6">É <span class="hl">excesso de peso.</span></div>` },
    { dur: 3.2, theme: "light", html: `
      <div class="k c a" data-d="0">5 minutos por dia · 30 dias</div>
      ${MOCK}
      <div class="p c a" data-d=".5">Uma palavra, uma reflexão e uma prática por dia para a mente finalmente descansar.</div>` },
    OFFER("light")
  ],

  /* 2 — Curiosidade: a frase de 2 mil anos */
  "02-frase-de-2-mil-anos": [
    { dur: 2.6, theme: "light", html: `
      <div class="k a" data-d="0">Salva esse vídeo</div>
      <div class="h a" data-d=".15">A frase de <span class="hl">2 mil anos</span> que acalma uma mente ansiosa:</div>` },
    { dur: 4.4, theme: "light", html: `
      <div class="quote a" data-d="0" data-type="“Não se preocupem com o amanhã… Basta a cada dia o seu próprio mal.”" data-speed="26"></div>
      <div class="ref a" data-d="3.2">MATEUS 6:34</div>` },
    { dur: 3.2, theme: "light", html: `
      <div class="p a" data-d="0">A ansiedade nasce de tentar viver o amanhã com as forças de hoje.</div>
      <div class="h m a" data-d=".9">Hoje, faça só <span class="hl">uma coisa</span>. O resto, entregue.</div>` },
    { dur: 3.2, theme: "dark", html: `
      <div class="k c a" data-d="0">Tem mais 29 assim</div>
      ${MOCK}
      <div class="p c a" data-d=".5">Um ritual de 5 minutos por dia, durante 30 dias.</div>` },
    OFFER("dark")
  ],

  /* 3 — Diagnóstico: 3 sinais */
  "03-tres-sinais": [
    { dur: 2.4, theme: "light", html: `
      <div class="k a" data-d="0">Teste rápido</div>
      <div class="h a" data-d=".15">3 sinais de que sua mente está <span class="hl">sobrecarregada</span></div>` },
    { dur: 4.2, theme: "light", html: `
      <div class="row a" data-d="0"><span class="num">1</span>Acorda cansado, mesmo dormindo 8 horas</div>
      <div class="row a" data-d=".9"><span class="num">2</span>Pensa em mil coisas e não termina nenhuma</div>
      <div class="row a" data-d="1.8"><span class="num">3</span>Sente um aperto no peito sem saber o porquê</div>` },
    { dur: 2.6, theme: "dark", html: `
      <div class="p a" data-d="0">Se você marcou 2 ou mais…</div>
      <div class="h a" data-d=".5">Sua mente não precisa de mais informação. Precisa de <span class="hl">paz.</span></div>` },
    { dur: 3.2, theme: "light", html: `
      <div class="k c a" data-d="0">Palavra Secreta</div>
      ${MOCK}
      <div class="p c a" data-d=".5">5 minutos por dia para acalmar a mente e voltar a ter clareza.</div>` },
    OFFER("light")
  ]
};

/* ---------- motor de animação determinístico: render(t) ---------- */
const clamp = (x,a=0,b=1) => Math.min(b,Math.max(a,x));
const ease = x => 1 - Math.pow(1 - x, 3);
const easeBack = x => { const c=1.7; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
let current = null, curIdx = -1;

function totalDur(name){ return VIDEOS[name].reduce((s,x)=>s+x.dur,0); }

function render(name, t){
  const scenes = VIDEOS[name], total = totalDur(name);
  let acc = 0, idx = 0;
  for (; idx < scenes.length - 1 && t >= acc + scenes[idx].dur; idx++) acc += scenes[idx].dur;
  const sc = scenes[idx], lt = t - acc;
  const stage = document.getElementById("stage"), box = document.getElementById("scene");
  if (current !== name || curIdx !== idx){
    current = name; curIdx = idx;
    stage.className = sc.theme; box.innerHTML = sc.html;
  }
  // fundo com leve zoom contínuo (dá sensação de movimento)
  document.getElementById("bg").style.transform = `scale(${1 + 0.06 * (t/total)}) rotate(${0.6*Math.sin(t/3)}deg)`;
  document.getElementById("prog").style.width = (100 * t / total) + "%";

  const out = idx < scenes.length - 1 ? clamp((sc.dur - lt) / 0.25) : 1; // saída da cena
  box.querySelectorAll(".a").forEach(el => {
    const d = parseFloat(el.dataset.d || 0), fx = el.dataset.fx;
    const p = clamp((lt - d) / 0.45), e = ease(p);
    let tr = `translateY(${(1-e)*28}px)`;
    if (fx === "pop") tr = `scale(${0.6 + 0.4*easeBack(p)})`;
    if (fx === "pulse") tr = `translateY(${(1-e)*28}px) scale(${1 + 0.04*Math.sin(Math.max(0,lt-d-0.45)*7)})`;
    el.style.opacity = Math.min(e, out);
    el.style.transform = tr;
    if (el.dataset.type){
      const txt = el.dataset.type, n = Math.floor(clamp((lt - d) * parseFloat(el.dataset.speed), 0, txt.length));
      el.textContent = txt.slice(0, n);
    }
  });
}
window.VIDEOS = VIDEOS; window.render = render; window.totalDur = totalDur;

// pré-visualização no navegador: criativos.html#01-mente-que-nao-desliga
if (!navigator.webdriver){
  const name = (location.hash.slice(1) in VIDEOS) ? location.hash.slice(1) : Object.keys(VIDEOS)[0];
  const t0 = performance.now();
  (function loop(){ render(name, ((performance.now()-t0)/1000) % totalDur(name)); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
